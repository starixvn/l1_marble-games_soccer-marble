variables:
  SMOKE_PRODUCT_NAME: 2001
  NODEJS_IMAGE: hub.lumigame.com/base/node:20.9.0-alpine-24h1.1
  SRC_PATH: .

include:
  - project: "ci/core-cicd"
    ref: main
    file: "luminet.gitlab-ci.yml"

.unit_test_js:
  before_script:
  - |
    if [ "$NPM_LOCAL_HOST" != "" ]; then
      echo "Using local npm registry: $NPM_LOCAL_HOST"
      npm set registry $NPM_LOCAL_HOST
    fi
  - echo $SRC_PATH
  - cd "$SRC_PATH"
  - npm ci
  artifacts:
    when: always
    paths:
      - ./**/lcov.info
      - ./**/coverage
    reports:
      junit:
        - ./**/coverage/unit-tests.xml
    expire_in: 1 day
